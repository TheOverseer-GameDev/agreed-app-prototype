<!doctype html>
<html lang="en-CA" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
(function(){
  var TARGET=412;
  function coarse(){try{return window.matchMedia("(pointer:coarse)").matches}catch(e){return "ontouchstart" in window}}
  function suggestsPhone(){
    var dpr=window.devicePixelRatio||1;
    var phys=(screen.width||0)*dpr;
    // Physical short side in the phone range, including a broken WebView
    // that reports CSS width already in physical pixels (e.g. 1080, dpr 1).
    if(phys>=600 && phys<=1600) return true;
    if((screen.width||0)>0 && screen.width<=500) return true;
    return false;
  }
  function shouldFit(){ return coarse() && window.innerWidth>600 && suggestsPhone(); }
  function setMeta(){
    var m=document.querySelector('meta[name="viewport"]');
    if(!m){m=document.createElement("meta");m.setAttribute("name","viewport");document.head.appendChild(m)}
    m.setAttribute("content","width="+TARGET+", viewport-fit=cover");
  }
  function forceScale(){
    var vw=window.innerWidth, vh=window.innerHeight;
    if(vw<=600) return false;
    var scale=vw/TARGET;
    var app=document.getElementById("app");
    if(!app) return false;
    app.style.width=TARGET+"px";
    app.style.height=Math.round(vh/scale)+"px";
    app.style.zoom=String(scale);
    return true;
  }
  function afterMeta(){
    if(!shouldFit()) return;
    if(forceScale()) return;
    document.addEventListener("DOMContentLoaded", function(){ if(shouldFit()) forceScale(); });
  }
  function fit(){
    if(!shouldFit()) return;
    setMeta();
    requestAnimationFrame(afterMeta);
  }
  fit();
  window.addEventListener("resize",fit,{passive:true});
  window.addEventListener("orientationchange",fit,{passive:true});
})();
</script>
<meta name="theme-color" content="#06080F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agreed">
<meta name="description" content="Everything you've agreed to, in one place.">
<title>Agreed</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/Inter.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav class="tabbar"></nav>
  <div class="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast"></div>
</div>
<script src="data.js"></script>
<script src="catalog.js"></script>
<script src="app.js"></script>
</body>
</html>
